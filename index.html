<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Invitation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #fff1f5, #ffe4ec);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #5a3d45;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 25px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    }

    .flower {
      font-size: 45px;
    }

    h1 {
      font-size: 38px;
      margin: 10px 0;
    }

    h2 {
      font-size: 25px;
      margin: 10px 0 20px;
    }

    .message {
      font-size: 17px;
      line-height: 1.7;
    }

    .details {
      background: #fff4f7;
      border-radius: 18px;
      padding: 18px;
      margin: 25px 0;
      line-height: 1.8;
    }

    .location-btn {
      display: inline-block;
      text-decoration: none;
      background: #d97998;
      color: white;
      padding: 13px 25px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
    }

    .location-btn:hover {
      background: #bd5f80;
    }

    .footer {
      margin-top: 25px;
      font-size: 14px;
      color: #8a6871;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="flower">🌸✨🌸</div>

    <h1>You're Invited!</h1>

    <h2>Birthday Celebration 🎂</h2>

    <p class="message">
      Come and celebrate this special day with us.
      Your presence will make the celebration even more beautiful! 💕
    </p>

    <div class="details">
      📅 <strong>Date:</strong> 01 October 2026<br>
      ⏰ <strong>Time:</strong> 7:00 PM<br>
      📍 <strong>Venue:</strong> Our HOME
    </div>

    <a
      class="location-btn"
      href="https://maps.app.goo.gl/ihcj3MumxNMyJdnHA"
      target="_blank">
      📍 Open Location
    </a>

    <p class="footer">
      With love ❤️<br>
      We can't wait to celebrate with you!
    </p>

  </div>

</body>
</html>
